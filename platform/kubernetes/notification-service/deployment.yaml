apiVersion: apps/v1
kind: Deployment

metadata:
  name: notification-service
  namespace: nexora
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: 345063271422.dkr.ecr.us-east-2.amazonaws.com/eks-platform/notification-service:1.0
