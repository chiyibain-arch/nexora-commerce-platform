apiVersion: apps/v1
kind: Deployment

metadata:
  name: rating-service
  namespace: nexora

spec:
  replicas: 2

  selector:
    matchLabels:
      app: rating-service

  template:
    metadata:
      labels:
        app: rating-service

    spec:
      containers:
        - name: rating-service
          image: nexora-rating-service:1.0

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
